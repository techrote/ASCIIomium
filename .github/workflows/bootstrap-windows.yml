name: bootstrap-windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deterministic web fixtures in Chromium
        shell: pwsh
        run: .\tools\verify_web_fixtures.ps1 -OutputDir build/fixture-screenshots

      - name: Cache pinned CEF distribution
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-windows64-151.3.17-gf059e67-chromium-151.0.7922.138

      - name: Show CMake version
        shell: pwsh
        run: cmake --version

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Debug
        shell: pwsh
        run: cmake --build build --config Debug --target asciiomium asciiomium_live asciiomium_tests terminal_logic_tests terminal_console_smoke full_frame_emitter_tests vt_console_smoke render_golden_tests color_quantizer_tests benchmark_result_tests source_frame_tests live_runtime_tests asciiomium_frame_dump asciiomium_color_ramp asciiomium_vt_preview asciiomium_benchmark asciiomium_cef_capture --parallel

      - name: Test Debug
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Verify Debug version output
        shell: pwsh
        run: .\build\bin\DEBUG\asciiomium.exe --version

      - name: Verify Debug indexed frame dump
        shell: pwsh
        run: .\build\bin\DEBUG\asciiomium_frame_dump.exe --input .\fixtures\render\quad_2x4.ppm --columns 2 --rows 2 --filter nearest --colors 256

      - name: Verify Debug annotated VT dump
        shell: pwsh
        run: .\build\bin\DEBUG\asciiomium_frame_dump.exe --input .\fixtures\render\quad_2x4.ppm --columns 2 --rows 2 --filter nearest --colors 256 --vt-annotated

      - name: Generate Debug colour ramp
        shell: pwsh
        run: .\build\bin\DEBUG\asciiomium_color_ramp.exe --output .\build\color-modes-debug.svg

      - name: Run Debug offline benchmark
        shell: pwsh
        run: .\build\bin\DEBUG\asciiomium_benchmark.exe --samples 12 --source-width 320 --source-height 180 --columns 80 --rows 24 --filter box --colors 1024 --json .\build\benchmark-debug.json

      - name: Validate Debug benchmark JSON
        shell: pwsh
        run: |
          $data = Get-Content -Raw .\build\benchmark-debug.json | ConvertFrom-Json
          if ($data.schema -ne 'asciiomium-benchmark-v1') { throw 'wrong benchmark schema' }
          if ($data.fixture_bundle.version -ne 'web-fixtures-v1') { throw 'wrong fixture version' }
          if ($data.renderer.glyph_encoder -ne 'halfblock-u2580') { throw 'wrong glyph encoder' }
          if ($data.renderer.color_mode -ne '1024') { throw 'wrong colour mode' }
          if ($data.renderer.sampling_filter -ne 'box') { throw 'wrong filter' }
          if ($data.terminal.columns -ne 80 -or $data.terminal.rows -ne 24) { throw 'wrong terminal geometry' }
          if ($null -ne $data.timing.diff) { throw 'offline diff metric must be null' }
          if ($data.bandwidth.bytes_per_frame -le 0) { throw 'benchmark emitted no bytes' }

      - name: Capture Debug CEF OSR fixture with resize
        shell: pwsh
        run: |
          .\build\bin\DEBUG\asciiomium_cef_capture.exe `
            --fixture colour-ramps --freeze `
            --width 640 --height 360 `
            --resize-width 800 --resize-height 450 `
            --min-paints 2 --timeout-ms 20000 `
            --output .\build\cef-colour-debug.bmp `
            --report .\build\cef-colour-debug.json

      - name: Validate Debug CEF OSR capture
        shell: pwsh
        run: |
          $data = Get-Content -Raw .\build\cef-colour-debug.json | ConvertFrom-Json
          if ($data.schema -ne 'asciiomium-cef-capture-v1') { throw 'wrong CEF capture schema' }
          if (-not $data.load.complete) { throw 'CEF local fixture did not complete loading' }
          if (-not $data.post_load_refresh.observed) { throw 'CEF capture is not fresh after load completion' }
          if ($data.view.width -ne 800 -or $data.view.height -ne 450) { throw 'CEF resize dimensions not observed' }
          if ($data.view.paint_count -lt 2 -or $data.view.generation -lt 2) { throw 'insufficient CEF paint generations' }
          if ($data.view.rgb_byte_span -lt 64) { throw 'CEF colour fixture capture is suspiciously uniform' }
          if (-not $data.resize.requested -or -not $data.resize.observed) { throw 'CEF resize contract failed' }
          if ($data.view.alpha_min -ne 255 -or $data.view.alpha_max -ne 255) { throw 'baseline CEF view was not opaque as configured' }
          if (-not $data.closed_cleanly) { throw 'CEF did not close cleanly' }
          if ($data.pixel_contract -notmatch '^BGRA8') { throw 'CEF pixel contract missing' }

      - name: Run Debug static live pipeline
        shell: pwsh
        run: |
          .\build\bin\DEBUG\asciiomium_live.exe `
            --fixture flat-ui --freeze `
            --width 640 --height 360 `
            --columns 100 --rows 30 `
            --fps 20 --cef-fps 60 --duration-ms 1500 `
            --no-terminal --quiet `
            --report .\build\live-static-debug.json `
            --evidence-svg .\build\live-static-debug.svg `
            --vt-output .\build\live-static-debug.vt

      - name: Validate Debug static live idling
        shell: pwsh
        run: |
          $data = Get-Content -Raw .\build\live-static-debug.json | ConvertFrom-Json
          if ($data.schema -ne 'asciiomium-live-v1') { throw 'wrong live schema' }
          if (-not $data.load.complete) { throw 'static live fixture did not complete loading' }
          if ($data.renderer.glyph_encoder -ne 'halfblock-u2580') { throw 'wrong live glyph encoder' }
          if ($data.renderer.color_mode -ne '1024') { throw '1024 colour is not the live default' }
          if ($data.renderer.sampling_filter -ne 'box') { throw 'box filter is not the live default' }
          if ($data.scheduler.rendered_frames -ne $data.scheduler.emitted_frames) { throw 'render/emission accounting mismatch' }
          if ($data.scheduler.emitted_frames -lt 1) { throw 'static live fixture emitted no terminal frames' }
          if ($data.scheduler.emitted_frames -gt 8) { throw 'static page kept repainting instead of idling' }
          if ($data.runtime.idle_iterations -le $data.scheduler.rendered_frames) { throw 'static loop did not spend time idle' }
          if (-not $data.runtime.terminal_restored) { throw 'headless live teardown did not complete' }
          if (-not $data.runtime.closed_cleanly) { throw 'CEF did not close cleanly after static live run' }
          if ($data.runtime.last_vt_bytes -le 0) { throw 'live full-frame emitter produced no VT payload' }

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --target asciiomium asciiomium_live asciiomium_tests terminal_logic_tests terminal_console_smoke full_frame_emitter_tests vt_console_smoke render_golden_tests color_quantizer_tests benchmark_result_tests source_frame_tests live_runtime_tests asciiomium_frame_dump asciiomium_color_ramp asciiomium_vt_preview asciiomium_benchmark asciiomium_cef_capture --parallel

      - name: Test Release
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify Release version output
        shell: pwsh
        run: .\build\bin\RELEASE\asciiomium.exe --version

      - name: Verify Release 1024-colour frame dump
        shell: pwsh
        run: .\build\bin\RELEASE\asciiomium_frame_dump.exe --input .\fixtures\render\quad_2x4.ppm --columns 2 --rows 2 --filter nearest --colors 1024

      - name: Generate Release colour ramp
        shell: pwsh
        run: .\build\bin\RELEASE\asciiomium_color_ramp.exe --output .\build\color-modes-release.svg

      - name: Run Release offline benchmark
        shell: pwsh
        run: .\build\bin\RELEASE\asciiomium_benchmark.exe --samples 24 --source-width 640 --source-height 360 --columns 160 --rows 50 --filter box --colors 1024 --json .\build\benchmark-release.json

      - name: Validate Release benchmark JSON
        shell: pwsh
        run: |
          $data = Get-Content -Raw .\build\benchmark-release.json | ConvertFrom-Json
          if ($data.schema -ne 'asciiomium-benchmark-v1') { throw 'wrong benchmark schema' }
          if ($data.source.viewport.width -ne 640 -or $data.source.viewport.height -ne 360) { throw 'wrong source geometry' }
          if ($data.terminal.columns -ne 160 -or $data.terminal.rows -ne 50) { throw 'wrong terminal geometry' }
          if ($data.renderer.color_mode -ne '1024') { throw 'wrong colour mode' }
          if ($data.timing.render_conversion.p95_ms -le 0) { throw 'missing render timing' }
          if ($data.timing.vt_serialization.p95_ms -le 0) { throw 'missing VT timing' }
          if ($data.process.working_set_bytes -le 0) { throw 'missing working-set metric' }

      - name: Capture Release animated CEF OSR fixture
        shell: pwsh
        run: |
          .\build\bin\RELEASE\asciiomium_cef_capture.exe `
            --fixture motion-scroll `
            --width 640 --height 360 `
            --frame-rate 30 --min-paints 6 --timeout-ms 20000 `
            --output .\build\cef-motion-release.bmp `
            --report .\build\cef-motion-release.json

      - name: Validate Release animated CEF generations
        shell: pwsh
        run: |
          $data = Get-Content -Raw .\build\cef-motion-release.json | ConvertFrom-Json
          if ($data.schema -ne 'asciiomium-cef-capture-v1') { throw 'wrong CEF capture schema' }
          if (-not $data.post_load_refresh.observed) { throw 'animated CEF capture is not fresh after load completion' }
          if ($data.view.width -ne 640 -or $data.view.height -ne 360) { throw 'wrong animated CEF dimensions' }
          if ($data.view.paint_count -lt 6 -or $data.view.generation -lt 6) { throw 'animated fixture did not generate repeated paints' }
          if ($data.view.rgb_byte_span -lt 64) { throw 'animated CEF capture is suspiciously uniform' }
          if ($data.view.storage_capacity_bytes -lt (640 * 360 * 4)) { throw 'view storage is unexpectedly small' }
          if (-not $data.closed_cleanly) { throw 'CEF did not close cleanly after animated fixture' }

      - name: Run Release animated live pipeline
        shell: pwsh
        run: |
          .\build\bin\RELEASE\asciiomium_live.exe `
            --fixture motion-scroll `
            --width 640 --height 360 `
            --columns 120 --rows 40 `
            --fps 20 --cef-fps 60 --duration-ms 2000 `
            --no-terminal --quiet `
            --report .\build\live-motion-release.json `
            --evidence-svg .\build\live-motion-release.svg `
            --vt-output .\build\live-motion-release.vt

      - name: Validate Release live frame pacing
        shell: pwsh
        run: |
          $data = Get-Content -Raw .\build\live-motion-release.json | ConvertFrom-Json
          if ($data.schema -ne 'asciiomium-live-v1') { throw 'wrong live schema' }
          if (-not $data.load.complete) { throw 'animated live fixture did not complete loading' }
          if ($data.renderer.max_fps -ne 20) { throw 'wrong live FPS cap' }
          if ($data.scheduler.emitted_frames -lt 10) { throw 'animated live fixture emitted too few frames' }
          if ($data.scheduler.rendered_frames -ne $data.scheduler.emitted_frames) { throw 'render/emission accounting mismatch' }
          if ($data.source.view_paint_count -le $data.scheduler.emitted_frames) { throw 'source did not outrun terminal output' }
          if ($data.scheduler.coalesced_generations -le 0) { throw 'newest-frame coalescing was not observed' }
          if ($data.scheduler.observed_emitted_fps -gt 22.0) { throw 'live output exceeded FPS cap tolerance' }
          if ($data.timing_ms.conversion.average -le 0 -or $data.timing_ms.conversion.p95 -le 0) { throw 'missing live conversion timings' }
          if (-not $data.runtime.terminal_restored) { throw 'live teardown did not complete' }
          if (-not $data.runtime.closed_cleanly) { throw 'CEF did not close cleanly after live run' }
          if ($data.runtime.last_vt_bytes -le 0) { throw 'animated live VT payload missing' }

      - name: Upload colour-ramp evidence
        uses: actions/upload-artifact@v4
        with:
          name: asciiomium-colour-mode-ramp
          path: |
            build/color-modes-debug.svg
            build/color-modes-release.svg
          if-no-files-found: error

      - name: Upload fixture and benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: asciiomium-fixture-benchmark-evidence
          path: |
            build/fixture-screenshots/*.png
            build/benchmark-debug.json
            build/benchmark-release.json
          if-no-files-found: error

      - name: Upload CEF OSR evidence
        uses: actions/upload-artifact@v4
        with:
          name: asciiomium-cef-osr-evidence
          path: |
            build/cef-colour-debug.bmp
            build/cef-colour-debug.json
            build/cef-motion-release.bmp
            build/cef-motion-release.json
            build/fixture-screenshots/colour-ramps.png
            build/fixture-screenshots/motion-scroll.png
          if-no-files-found: error

      - name: Upload live terminal pipeline evidence
        uses: actions/upload-artifact@v4
        with:
          name: asciiomium-live-pipeline-evidence
          path: |
            build/live-static-debug.json
            build/live-static-debug.svg
            build/live-static-debug.vt
            build/live-motion-release.json
            build/live-motion-release.svg
            build/live-motion-release.vt
          if-no-files-found: error

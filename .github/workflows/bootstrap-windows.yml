name: bootstrap-windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pinned CEF distribution
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-windows64-151.3.17-gf059e67-chromium-151.0.7922.138

      - name: Show CMake version
        shell: pwsh
        run: cmake --version

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Debug
        shell: pwsh
        run: cmake --build build --config Debug --target asciiomium asciiomium_tests terminal_logic_tests terminal_console_smoke full_frame_emitter_tests vt_console_smoke render_golden_tests color_quantizer_tests asciiomium_frame_dump asciiomium_color_ramp asciiomium_vt_preview --parallel

      - name: Test Debug
        shell: pwsh
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Verify Debug version output
        shell: pwsh
        run: .\build\bin\DEBUG\asciiomium.exe --version

      - name: Verify Debug indexed frame dump
        shell: pwsh
        run: .\build\bin\DEBUG\asciiomium_frame_dump.exe --input .\fixtures\render\quad_2x4.ppm --columns 2 --rows 2 --filter nearest --colors 256

      - name: Generate Debug colour ramp
        shell: pwsh
        run: .\build\bin\DEBUG\asciiomium_color_ramp.exe --output .\build\color-modes-debug.svg

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --target asciiomium asciiomium_tests terminal_logic_tests terminal_console_smoke full_frame_emitter_tests vt_console_smoke render_golden_tests color_quantizer_tests asciiomium_frame_dump asciiomium_color_ramp asciiomium_vt_preview --parallel

      - name: Test Release
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify Release version output
        shell: pwsh
        run: .\build\bin\RELEASE\asciiomium.exe --version

      - name: Verify Release 1024-colour frame dump
        shell: pwsh
        run: .\build\bin\RELEASE\asciiomium_frame_dump.exe --input .\fixtures\render\quad_2x4.ppm --columns 2 --rows 2 --filter nearest --colors 1024

      - name: Generate Release colour ramp
        shell: pwsh
        run: .\build\bin\RELEASE\asciiomium_color_ramp.exe --output .\build\color-modes-release.svg

      - name: Upload colour-ramp evidence
        uses: actions/upload-artifact@v4
        with:
          name: asciiomium-colour-mode-ramp
          path: |
            build/color-modes-debug.svg
            build/color-modes-release.svg
          if-no-files-found: error

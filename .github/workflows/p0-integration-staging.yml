name: p0-integration-staging

on:
  push:
    branches: [p0-integration-rc-2026-11-14]

permissions:
  contents: write

concurrency:
  group: p0-integration-staging-2026-11-14
  cancel-in-progress: false

jobs:
  mechanical-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge next approved source branch without discarding conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          stage=$(cat tools/p0-integration-stage.txt)
          case "$stage" in
            package) ref=issue-17-portable-windows ;;
            telemetry) ref=issue-15-structured-telemetry ;;
            complete) echo 'Integration staging complete'; exit 0 ;;
            *) echo "Unknown stage: $stage"; exit 1 ;;
          esac
          git fetch origin "refs/heads/$ref:refs/remotes/origin/$ref"
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo "Integrating $ref: $(git rev-parse refs/remotes/origin/$ref)"
          if git merge-base --is-ancestor "refs/remotes/origin/$ref" HEAD; then
            echo "Already integrated $ref"; exit 0
          fi
          git config user.name 'ASCIIomium P0 integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git -c merge.conflictStyle=zdiff3 merge --no-ff --no-commit "refs/remotes/origin/$ref"
          result=$?
          set -e
          echo "git merge exit code: $result"
          if [ "$result" -ne 0 ]; then
            echo 'Unresolved paths, preserved in source with explicit zdiff3 markers:'
            git diff --name-only --diff-filter=U | tee /tmp/p0-conflicts.txt
            echo '::group::Conflict markers'
            while IFS= read -r path; do
              echo "=== $path ==="
              grep -n -E '^<<<<<<< |^||||||| |^=======|^>>>>>>> ' "$path" || true
            done < /tmp/p0-conflicts.txt
            echo '::endgroup::'
          fi
          git add -A
          git -c user.name='ASCIIomium P0 integration' commit -m "P0 mechanical merge $ref (manual conflict reconciliation required where marked)"
          git push origin HEAD:refs/heads/p0-integration-rc-2026-11-14
          echo "Published merge source: $(git rev-parse HEAD)"
          echo "Stage: $stage"
